# =============================================================================
# ProjectView - edge reverse proxy
#
# This is the only container published to the host. It terminates TLS and
# owns every routing/security rule; the SPA (frontend), the API (backend) and
# PostgreSQL stay on the internal Compose network and are never reachable
# directly. Because TLS ends here, the backend can safely run with
# NODE_ENV=production and issue "secure" session cookies.
# =============================================================================

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile      on;
    tcp_nopush    on;
    server_tokens off;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    client_max_body_size 25m;
    client_body_timeout  30s;
    client_header_timeout 30s;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript
               application/x-javascript text/xml application/xml image/svg+xml;

    # --- Rate limiting -------------------------------------------------------
    # The login endpoint is the one worth protecting: every attempt reaches
    # Active Directory, so unthrottled retries mean both credential stuffing
    # and the risk of tripping AD account lockout policies.
    limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=api:10m   rate=30r/s;
    limit_req_status 429;
    limit_conn_zone $binary_remote_addr zone=perip:10m;
    limit_conn_status 429;

    # WebSocket upgrade: keeps "Connection: close" for ordinary requests.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Docker's embedded DNS server. Needed because the upstreams are resolved
    # per request (see below) rather than once at startup.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    # Deliberately NOT an "upstream" block. nginx resolves a hostname in an
    # upstream once, at configuration load, and caches the address forever - so
    # redeploying the backend gives it a new container IP and every request
    # 502s until the proxy is also restarted. Putting the target in a variable
    # forces resolution per request, so a backend restart is invisible here.
    map $host $backend_upstream {
        default "backend:4000";
    }

    map $host $frontend_upstream {
        default "frontend:80";
    }

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;

    # --- HTTP :80 - redirect only --------------------------------------------
    server {
        listen 80;
        server_name _;

        # Keep the ACME http-01 challenge path reachable in plain HTTP so
        # Let's Encrypt / certbot can issue real certificates.
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Container healthcheck, answered before the redirect so the probe
        # never has to deal with TLS or the self-signed certificate.
        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # --- HTTPS :443 - the application's only entry point ---------------------
    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers off;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # Applied to every response, proxied ones included ("always").
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options    "nosniff" always;
        add_header X-Frame-Options           "SAMEORIGIN" always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;

        limit_conn perip 64;

        # Proxy-level health probe: answers even when the backend is down.
        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        # Rate limited apart from the rest of the API (see above).
        location = /api/auth/login {
            limit_req zone=login burst=5 nodelay;
            proxy_pass http://$backend_upstream$request_uri;
        }

        location /api/ {
            limit_req zone=api burst=60 nodelay;
            proxy_pass http://$backend_upstream$request_uri;
            proxy_read_timeout 60s;
        }

        # Realtime push channel (chat + notifications). Needs the upgrade
        # handshake and a long read timeout, since the server may stay quiet
        # between pushes while the connection must remain open.
        location /ws {
            proxy_pass http://$backend_upstream$request_uri;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # Everything else is the React SPA. The frontend container handles the
        # history-API fallback to index.html and the asset cache headers -
        # deliberately not repeated here, because an add_header in a location
        # block drops every add_header inherited from the server block,
        # which would silently strip HSTS from those responses.
        location / {
            proxy_pass http://$frontend_upstream$request_uri;
        }
    }
}
