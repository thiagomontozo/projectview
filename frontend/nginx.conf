# Serves the built React SPA. This container is NOT published to the host:
# all traffic arrives from the edge proxy (see ../proxy/nginx.conf), which
# terminates TLS and routes /api and /ws to the backend before anything can
# reach here. So this config only has to serve static files.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    # Vite emits content-hashed filenames under /assets, so they can be
    # cached indefinitely - a new build produces new URLs.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html must never be cached, otherwise browsers keep loading the
    # old bundle after a deploy.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # History-API fallback for client-side routing.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
