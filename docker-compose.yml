services:
  # Edge reverse proxy: terminates TLS and is the only service published to
  # the host. Everything else stays on the internal network.
  proxy:
    build: ./proxy
    restart: unless-stopped
    environment:
      # Common name used when generating the self-signed fallback certificate.
      TLS_COMMON_NAME: ${TLS_COMMON_NAME:-localhost}
    volumes:
      # Drop your real fullchain.pem/privkey.pem here (see proxy/certs/README.md).
      - ./proxy/certs:/etc/nginx/certs
      # Webroot for Let's Encrypt http-01 challenges.
      - ./proxy/certbot-webroot:/var/www/certbot
    depends_on:
      - frontend
      - backend
      - minio
    ports:
      - '${PROXY_HTTP_PORT:-80}:80'
      - '${PROXY_HTTPS_PORT:-443}:443'

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-projectview}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-projectview}
      POSTGRES_DB: ${POSTGRES_DB:-projectview}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      # Bound to loopback: reachable with a local psql for inspection,
      # never exposed to the network.
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-projectview} -d ${POSTGRES_DB:-projectview}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Object storage for attachments. MinIO speaks the S3 API, so the same
  # backend code runs unchanged against Amazon S3, Cloud Storage's S3 endpoint
  # or an on-prem appliance: point STORAGE_* elsewhere and remove this service.
  #
  # Not published to the host. Browsers reach it through the edge proxy, which
  # is why the presigned links are signed for the proxy's hostname.
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${STORAGE_ACCESS_KEY:-projectview}
      MINIO_ROOT_PASSWORD: ${STORAGE_SECRET_KEY:-projectview-storage}
    volumes:
      - minio_data:/data
    expose:
      - '9000'
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Creates the bucket on first boot and exits. A one-shot container rather
  # than logic in the backend: creating a bucket is a deployment action, and a
  # running application that can create its own buckets is one holding
  # credentials far broader than reading and writing objects needs.
  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      STORAGE_BUCKET: ${STORAGE_BUCKET:-attachments}
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY:-projectview}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY:-projectview-storage}
    entrypoint: >
      /bin/sh -c "
      mc alias set pv http://minio:9000 \"$${STORAGE_ACCESS_KEY}\" \"$${STORAGE_SECRET_KEY}\" &&
      mc mb --ignore-existing pv/\"$${STORAGE_BUCKET}\" &&
      mc anonymous set none pv/\"$${STORAGE_BUCKET}\" &&
      echo 'bucket ready'
      "
    restart: "no"

  backend:
    build:
      context: ./backend
      additional_contexts:
        # Optional extra root CAs for TLS-intercepting networks (see ca/README.md).
        ca: ./ca
    restart: unless-stopped
    # Every value below is interpolated from the root ".env" file when it
    # exists (Compose loads it automatically) and falls back to a working
    # default otherwise, so "docker compose up" works on a fresh clone.
    environment:
      # --- PostgreSQL (fully configurable) ---
      # The schema is created automatically on first boot by the migrations
      # embedded in the binary.
      DATABASE_URL: ${DATABASE_URL:-postgres://projectview:projectview@postgres:5432/projectview?sslmode=disable}
      DATABASE_MAX_CONNS: ${DATABASE_MAX_CONNS:-10}
      # --- Sessions ---
      JWT_SECRET: ${JWT_SECRET:-please-change-this-to-a-long-random-string}
      JWT_EXPIRES_IN_HOURS: ${JWT_EXPIRES_IN_HOURS:-8}
      # --- Active Directory / LDAP ---
      AD_ENABLED: ${AD_ENABLED:-false}
      AD_URL: ${AD_URL:-}
      AD_BASE_DN: ${AD_BASE_DN:-}
      AD_DOMAIN: ${AD_DOMAIN:-}
      AD_BIND_DN: ${AD_BIND_DN:-}
      AD_BIND_PASSWORD: ${AD_BIND_PASSWORD:-}
      AD_USERNAME_ATTRIBUTE: ${AD_USERNAME_ATTRIBUTE:-sAMAccountName}
      AD_TLS_REJECT_UNAUTHORIZED: ${AD_TLS_REJECT_UNAUTHORIZED:-true}
      # --- Internal e-mail (SMTP) ---
      SMTP_ENABLED: ${SMTP_ENABLED:-false}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-ProjectView <no-reply@example.com>}
      # --- Deadline alerts ---
      ALERT_CRON: ${ALERT_CRON:-0 * * * *}
      ALERT_WARN_DAYS_BEFORE: ${ALERT_WARN_DAYS_BEFORE:-2}
      # --- First-run admin bootstrap ---
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-admin}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-admin@example.com}
      BOOTSTRAP_ADMIN_NAME: ${BOOTSTRAP_ADMIN_NAME:-Administrator}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-ChangeMe123!}
      # --- Single sign-on (OpenID Connect) ---
      # These are the starting values. An administrator can change them from
      # the settings screen, which stores them in the database and applies
      # them without a restart.
      OIDC_ENABLED: ${OIDC_ENABLED:-false}
      OIDC_ISSUER_URL: ${OIDC_ISSUER_URL:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_REDIRECT_URL: ${OIDC_REDIRECT_URL:-https://localhost/api/auth/oidc/callback}
      OIDC_SCOPES: ${OIDC_SCOPES:-openid profile email}
      OIDC_AUTO_PROVISION: ${OIDC_AUTO_PROVISION:-false}
      # --- Retention (0 keeps everything) ---
      AUDIT_RETENTION_DAYS: ${AUDIT_RETENTION_DAYS:-0}
      NOTIFICATION_RETENTION_DAYS: ${NOTIFICATION_RETENTION_DAYS:-0}
      RETENTION_CRON: ${RETENTION_CRON:-30 3 * * *}
      # --- Settings mirror ---
      # Where the settings screen writes its .env-shaped copy. The database is
      # authoritative and is what the application reads; this file exists for
      # backup and review. Leave it empty to switch mirroring off.
      SETTINGS_ENV_FILE: ${SETTINGS_ENV_FILE:-/config/app.env}
      # --- Attachments (S3-compatible object storage) ---
      # STORAGE_ENDPOINT is what the backend calls; STORAGE_PUBLIC_URL is what
      # the browser is sent to. They differ here because MinIO is reachable
      # only inside this network, and a signed URL is signed for the host that
      # will actually receive it.
      STORAGE_ENDPOINT: ${STORAGE_ENDPOINT:-http://minio:9000}
      STORAGE_PUBLIC_URL: ${STORAGE_PUBLIC_URL:-https://localhost}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-attachments}
      STORAGE_REGION: ${STORAGE_REGION:-us-east-1}
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY:-projectview}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY:-projectview-storage}
      STORAGE_FORCE_PATH_STYLE: ${STORAGE_FORCE_PATH_STYLE:-true}
      STORAGE_URL_TTL_MINUTES: ${STORAGE_URL_TTL_MINUTES:-15}
      ATTACHMENT_MAX_MB: ${ATTACHMENT_MAX_MB:-25}
      ATTACHMENT_MAX_TASK_MB: ${ATTACHMENT_MAX_TASK_MB:-250}
      ATTACHMENT_ALLOWED_TYPES: ${ATTACHMENT_ALLOWED_TYPES:-}
      # --- Misc ---
      # Traffic is same-origin behind the proxy, so this only matters for
      # external API clients. Narrow it to your domain when you have one.
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      PORT: 4000
      # Marks session cookies "secure"; safe because the proxy serves HTTPS.
      NODE_ENV: production
    volumes:
      # A directory rather than a single file: bind-mounting a file that does
      # not exist yet makes Docker create a directory in its place, and a
      # directory called .env in the project root stops compose from starting
      # at all.
      - ./config:/config
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    # Not published: reachable only through the proxy, on the internal network.
    expose:
      - '4000'
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:4000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      additional_contexts:
        ca: ./ca
    restart: unless-stopped
    depends_on:
      - backend
    # Not published: served to users through the proxy.
    expose:
      - '80'

volumes:
  postgres_data:
  minio_data:
