name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: backend/go.sum

      - name: Check formatting
        working-directory: backend
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: Build
        working-directory: backend
        run: go build ./...

      - name: Vet
        working-directory: backend
        run: go vet ./...

      - name: Test
        working-directory: backend
        run: go test -race -coverprofile=coverage.out ./...

      - name: Coverage summary
        working-directory: backend
        run: go tool cover -func=coverage.out | tail -n 20

  gencert:
    name: Proxy certificate helper (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: proxy/gencert/go.mod

      - name: Vet and build
        working-directory: proxy/gencert
        run: |
          gofmt -l . | (! grep .)
          go vet ./...
          go build -o /tmp/gencert .

      - name: Generated certificate is valid
        run: |
          /tmp/gencert /tmp/fullchain.pem /tmp/privkey.pem projectview.test 30
          openssl x509 -in /tmp/fullchain.pem -noout -subject -dates
          # The SANs matter: nginx must serve both the configured name and
          # localhost, otherwise local runs get a name-mismatch error.
          openssl x509 -in /tmp/fullchain.pem -noout -text | grep -A1 'Subject Alternative Name'
          openssl x509 -in /tmp/fullchain.pem -noout -text | grep -q 'DNS:projectview.test'
          openssl x509 -in /tmp/fullchain.pem -noout -text | grep -q 'DNS:localhost'
          openssl pkey -in /tmp/privkey.pem -noout -check

  frontend:
    name: Frontend (React + TypeScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Type-check
        working-directory: frontend
        run: npm run typecheck

      - name: Test
        working-directory: frontend
        run: npm run test

      - name: Build
        working-directory: frontend
        run: npm run build

  shellcheck:
    name: Shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck
        # Fails on warnings and errors; style/info notes are not gating.
        run: shellcheck -S warning scripts/smoke-test.sh proxy/docker-entrypoint.sh

  integration:
    name: Integration (docker compose + smoke test)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Validate the compose file
        run: docker compose config -q

      - name: Start the stack
        run: docker compose up -d --build

      - name: Wait for every container to report healthy
        run: |
          for _ in $(seq 1 60); do
            state="$(docker compose ps --format '{{.Service}}={{.Health}}')"
            echo "$state"
            if ! echo "$state" | grep -q 'unhealthy\|starting'; then
              exit 0
            fi
            sleep 5
          done
          echo "containers never settled into a healthy state" >&2
          exit 1

      - name: Smoke test
        run: bash scripts/smoke-test.sh https://localhost

      - name: Schema was created on first run
        run: |
          # The requirement is that an empty database is provisioned
          # automatically, so assert the tables, indexes and the migration
          # bookkeeping really exist.
          psql() { docker compose exec -T postgres psql -U projectview -d projectview -tAc "$1"; }

          psql "SELECT tablename FROM pg_tables WHERE schemaname='public' ORDER BY tablename" | tee /tmp/tables
          for t in users teams team_members projects project_members project_statuses \
                   tasks task_assignees task_comments task_alerts_sent \
                   chat_channels chat_channel_members chat_messages notifications \
                   sessions audit_log spaces space_members folders \
                   schema_migrations; do
            grep -qx "$t" /tmp/tables || { echo "missing table: $t" >&2; exit 1; }
          done

          # Every migration must be recorded, so a restart does not re-run one.
          for v in 0001_init 0002_sessions_and_audit 0003_search_and_hierarchy; do
            applied="$(psql "SELECT count(*) FROM schema_migrations WHERE version='$v'")"
            [ "$applied" = "1" ] || { echo "$v not recorded as applied" >&2; exit 1; }
          done

          # Full-text search depends on the generated column and its GIN index.
          psql "SELECT indexname FROM pg_indexes WHERE tablename='tasks'" | grep -q 'tasks_search_idx' \
            || { echo "missing full-text index on tasks" >&2; exit 1; }

          # The audit trail must never be writable-away by the app: assert it
          # is append-only in practice by checking nothing deleted the rows the
          # smoke test just generated.
          entries="$(psql "SELECT count(*) FROM audit_log")"
          [ "$entries" -gt 0 ] || { echo "audit trail is empty after the smoke test" >&2; exit 1; }

          psql "SELECT indexname FROM pg_indexes WHERE tablename='tasks'" | tee /tmp/task_indexes
          grep -q 'tasks_board_idx'  /tmp/task_indexes || { echo "missing board index" >&2; exit 1; }
          grep -q 'tasks_parent_idx' /tmp/task_indexes || { echo "missing parent index" >&2; exit 1; }

          # Referential integrity is the reason for the migration: prove the
          # cascade from projects down to tasks is actually declared.
          fks="$(psql "SELECT count(*) FROM information_schema.table_constraints
                        WHERE constraint_type='FOREIGN KEY' AND table_schema='public'")"
          [ "$fks" -ge 15 ] || { echo "expected foreign keys are missing (found $fks)" >&2; exit 1; }

      - name: Migrations are idempotent
        run: |
          # Restarting must not attempt to re-apply an already-applied version.
          docker compose restart backend
          sleep 10
          docker compose logs backend --no-color | grep -q 'Schema up to date' \
            || { echo "backend did not detect the schema as already migrated" >&2;
                 docker compose logs backend --no-color --tail 50; exit 1; }

      - name: Container logs
        if: failure()
        run: docker compose logs --no-color --tail 200

      - name: Tear down
        if: always()
        run: docker compose down -v
