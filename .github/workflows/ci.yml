name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: backend/go.sum

      - name: Check formatting
        working-directory: backend
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: Build
        working-directory: backend
        run: go build ./...

      - name: Vet
        working-directory: backend
        run: go vet ./...

      - name: Test
        working-directory: backend
        run: go test -race -coverprofile=coverage.out ./...

      - name: Coverage summary
        working-directory: backend
        run: go tool cover -func=coverage.out | tail -n 20

  gencert:
    name: Proxy certificate helper (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: proxy/gencert/go.mod

      - name: Vet and build
        working-directory: proxy/gencert
        run: |
          gofmt -l . | (! grep .)
          go vet ./...
          go build -o /tmp/gencert .

      - name: Generated certificate is valid
        run: |
          /tmp/gencert /tmp/fullchain.pem /tmp/privkey.pem projectview.test 30
          openssl x509 -in /tmp/fullchain.pem -noout -subject -dates
          # The SANs matter: nginx must serve both the configured name and
          # localhost, otherwise local runs get a name-mismatch error.
          openssl x509 -in /tmp/fullchain.pem -noout -text | grep -A1 'Subject Alternative Name'
          openssl x509 -in /tmp/fullchain.pem -noout -text | grep -q 'DNS:projectview.test'
          openssl x509 -in /tmp/fullchain.pem -noout -text | grep -q 'DNS:localhost'
          openssl pkey -in /tmp/privkey.pem -noout -check

  frontend:
    name: Frontend (React + TypeScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Type-check
        working-directory: frontend
        run: npm run typecheck

      - name: Test
        working-directory: frontend
        run: npm run test

      - name: Build
        working-directory: frontend
        run: npm run build

  shellcheck:
    name: Shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck
        # Fails on warnings and errors; style/info notes are not gating.
        run: |
          shellcheck -S warning \
            scripts/smoke-test.sh \
            scripts/loadtest/run.sh \
            e2e/run.sh \
            proxy/docker-entrypoint.sh

  integration:
    name: Integration (docker compose + smoke test)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Validate the compose file
        run: docker compose config -q

      - name: Start the stack
        run: docker compose up -d --build

      - name: Wait for every container to report healthy
        run: |
          for _ in $(seq 1 60); do
            state="$(docker compose ps --format '{{.Service}}={{.Health}}')"
            echo "$state"
            if ! echo "$state" | grep -q 'unhealthy\|starting'; then
              exit 0
            fi
            sleep 5
          done
          echo "containers never settled into a healthy state" >&2
          exit 1

      - name: Smoke test
        run: bash scripts/smoke-test.sh https://localhost

      # The pipeline could not see a screen until this step existed. Three
      # defects reached users while every job here stayed green: a login page
      # that rendered nothing, labels that showed as their own translation
      # keys, and dropdowns painted behind the dialog that opened them. All
      # three are invisible to an API assertion and obvious in a browser.
      #
      # Runs after the smoke test on purpose: if the API is broken, the browser
      # failures that follow describe the symptom rather than the cause, and
      # the shorter report is the one worth reading first.
      - name: Browser tests
        run: bash e2e/run.sh

      - name: Browser test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          # Traces are recorded only for failures, so this is small unless
          # something actually went wrong - and when it did, the trace is a
          # replay of the session rather than a screenshot to squint at.
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7
          if-no-files-found: ignore

      - name: Schema was created on first run
        run: |
          # The requirement is that an empty database is provisioned
          # automatically, so assert the tables, indexes and the migration
          # bookkeeping really exist.
          psql() { docker compose exec -T postgres psql -U projectview -d projectview -tAc "$1"; }

          psql "SELECT tablename FROM pg_tables WHERE schemaname='public' ORDER BY tablename" | tee /tmp/tables
          for t in users teams team_members projects project_members project_statuses \
                   tasks task_assignees task_comments task_alerts_sent \
                   chat_channels chat_channel_members chat_messages notifications \
                   sessions audit_log spaces space_members folders \
                   task_dependencies custom_field_definitions time_entries \
                   task_watchers automations automation_runs \
                   chat_reactions chat_mentions docs doc_revisions \
                   notification_preferences \
                   goals key_results dashboards project_baselines service_tokens \
                   app_settings \
                   attachments attachment_deletions \
                   task_recurrences templates \
                   schema_migrations; do
            grep -qx "$t" /tmp/tables || { echo "missing table: $t" >&2; exit 1; }
          done

          # The dependency graph must be acyclic by construction, not by
          # convention: assert the guard trigger is actually installed.
          psql "SELECT tgname FROM pg_trigger WHERE tgname = 'task_dependencies_acyclic'" | grep -q . \
            || { echo "dependency cycle guard is missing" >&2; exit 1; }

          # A reply is a reply to a root message, never to another reply.
          # Enforced by a trigger so no code path can nest a thread.
          psql "SELECT tgname FROM pg_trigger WHERE tgname = 'chat_messages_flat_threads'" | grep -q . \
            || { echo "thread-nesting guard is missing" >&2; exit 1; }

          # A series belongs to exactly one task at a time. The primary key is
          # what makes moving it forward atomic rather than a delete and an
          # insert with a window between them.
          psql "SELECT indexname FROM pg_indexes WHERE indexname = 'task_recurrences_pkey'" | grep -q . \
            || { echo "a recurrence could belong to two tasks" >&2; exit 1; }

          # One running timer per person is a database invariant.
          psql "SELECT indexname FROM pg_indexes WHERE indexname = 'time_entries_single_running_idx'" | grep -q . \
            || { echo "single-running-timer index is missing" >&2; exit 1; }

          # Deleting an attachment row has to take its object with it, and the
          # path that matters is the cascade - dropping a task or a project
          # removes rows in one statement the application never sees. The queue
          # is filled by a trigger precisely so no code path can bypass it.
          psql "SELECT tgname FROM pg_trigger WHERE tgname = 'attachments_queue_object_delete'" | grep -q . \
            || { echo "attachment object-delete trigger is missing" >&2; exit 1; }

          # An object is addressed by its storage key, so two rows sharing one
          # would make either row's deletion break the other's download.
          psql "SELECT indexname FROM pg_indexes WHERE tablename='attachments'" \
            | grep -q 'attachments_storage_key_key' \
            || { echo "attachment storage keys are not unique" >&2; exit 1; }

          # Every migration must be recorded, so a restart does not re-run one.
          for v in 0001_init 0002_sessions_and_audit 0003_search_and_hierarchy \
                   0004_product_engine 0005_collaboration 0006_enterprise \
                   0007_app_settings 0008_attachments \
                   0009_recurrence_and_templates; do
            applied="$(psql "SELECT count(*) FROM schema_migrations WHERE version='$v'")"
            [ "$applied" = "1" ] || { echo "$v not recorded as applied" >&2; exit 1; }
          done

          # One default dashboard per person, enforced rather than assumed: two
          # defaults means the app picks arbitrarily and the layout appears to
          # change on its own.
          psql "SELECT indexname FROM pg_indexes WHERE indexname = 'dashboards_one_default_idx'" | grep -q . \
            || { echo "single-default-dashboard index is missing" >&2; exit 1; }

          # A machine credential must never be readable from the database.
          hashed="$(psql "SELECT count(*) FROM information_schema.columns
                           WHERE table_name='service_tokens' AND column_name='token_hash'")"
          [ "$hashed" = "1" ] || { echo "service tokens must be stored hashed" >&2; exit 1; }
          plaintext="$(psql "SELECT count(*) FROM information_schema.columns
                              WHERE table_name='service_tokens' AND column_name IN ('token','secret')")"
          [ "$plaintext" = "0" ] || { echo "service_tokens stores a plaintext secret" >&2; exit 1; }

          # A saved credential must never be readable from the database. The
          # settings screen writes secrets sealed with a key derived from
          # JWT_SECRET, so a dump does not hand over the directory bind
          # password and the mail account alongside it.
          psql "SELECT count(*) FROM information_schema.columns
                 WHERE table_name='app_settings' AND column_name='is_secret'" | grep -qx 1 \
            || { echo "app_settings cannot distinguish secrets" >&2; exit 1; }

          # Erasure needs somewhere to record that it happened, or a second
          # request would rename the tombstone again.
          psql "SELECT count(*) FROM information_schema.columns
                 WHERE table_name='users' AND column_name='anonymized_at'" | grep -qx 1 \
            || { echo "users.anonymized_at is missing" >&2; exit 1; }

          # Full-text search depends on the generated column and its GIN index.
          psql "SELECT indexname FROM pg_indexes WHERE tablename='tasks'" | grep -q 'tasks_search_idx' \
            || { echo "missing full-text index on tasks" >&2; exit 1; }

          # The audit trail must never be writable-away by the app: assert it
          # is append-only in practice by checking nothing deleted the rows the
          # smoke test just generated.
          entries="$(psql "SELECT count(*) FROM audit_log")"
          [ "$entries" -gt 0 ] || { echo "audit trail is empty after the smoke test" >&2; exit 1; }

          psql "SELECT indexname FROM pg_indexes WHERE tablename='tasks'" | tee /tmp/task_indexes
          grep -q 'tasks_board_idx'  /tmp/task_indexes || { echo "missing board index" >&2; exit 1; }
          grep -q 'tasks_parent_idx' /tmp/task_indexes || { echo "missing parent index" >&2; exit 1; }

          # Referential integrity is the reason for the migration: prove the
          # cascade from projects down to tasks is actually declared.
          fks="$(psql "SELECT count(*) FROM information_schema.table_constraints
                        WHERE constraint_type='FOREIGN KEY' AND table_schema='public'")"
          [ "$fks" -ge 15 ] || { echo "expected foreign keys are missing (found $fks)" >&2; exit 1; }

      - name: Migrations are idempotent
        run: |
          # Restarting must not attempt to re-apply an already-applied version.
          docker compose restart backend
          sleep 10
          docker compose logs backend --no-color | grep -q 'Schema up to date' \
            || { echo "backend did not detect the schema as already migrated" >&2;
                 docker compose logs backend --no-color --tail 50; exit 1; }

      - name: Container logs
        if: failure()
        run: docker compose logs --no-color --tail 200

      - name: Tear down
        if: always()
        run: docker compose down -v
