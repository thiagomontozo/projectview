name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: backend/go.sum

      - name: Check formatting
        working-directory: backend
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: Build
        working-directory: backend
        run: go build ./...

      - name: Vet
        working-directory: backend
        run: go vet ./...

      - name: Test
        working-directory: backend
        run: go test -race -coverprofile=coverage.out ./...

      - name: Coverage summary
        working-directory: backend
        run: go tool cover -func=coverage.out | tail -n 20

  gencert:
    name: Proxy certificate helper (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: proxy/gencert/go.mod

      - name: Vet and build
        working-directory: proxy/gencert
        run: |
          gofmt -l . | (! grep .)
          go vet ./...
          go build -o /tmp/gencert .

      - name: Generated certificate is valid
        run: |
          /tmp/gencert /tmp/fullchain.pem /tmp/privkey.pem projectview.test 30
          openssl x509 -in /tmp/fullchain.pem -noout -subject -dates
          # The SANs matter: nginx must serve both the configured name and
          # localhost, otherwise local runs get a name-mismatch error.
          openssl x509 -in /tmp/fullchain.pem -noout -text | grep -A1 'Subject Alternative Name'
          openssl x509 -in /tmp/fullchain.pem -noout -text | grep -q 'DNS:projectview.test'
          openssl x509 -in /tmp/fullchain.pem -noout -text | grep -q 'DNS:localhost'
          openssl pkey -in /tmp/privkey.pem -noout -check

  frontend:
    name: Frontend (React + TypeScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Type-check
        working-directory: frontend
        run: npm run typecheck

      - name: Build
        working-directory: frontend
        run: npm run build

  shellcheck:
    name: Shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck
        # Fails on warnings and errors; style/info notes are not gating.
        run: shellcheck -S warning scripts/smoke-test.sh proxy/docker-entrypoint.sh

  integration:
    name: Integration (docker compose + smoke test)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Validate the compose file
        run: docker compose config -q

      - name: Start the stack
        run: docker compose up -d --build

      - name: Wait for every container to report healthy
        run: |
          for _ in $(seq 1 60); do
            state="$(docker compose ps --format '{{.Service}}={{.Health}}')"
            echo "$state"
            if ! echo "$state" | grep -q 'unhealthy\|starting'; then
              exit 0
            fi
            sleep 5
          done
          echo "containers never settled into a healthy state" >&2
          exit 1

      - name: Smoke test
        run: bash scripts/smoke-test.sh https://localhost

      - name: Schema was created on first run
        run: |
          # The requirement is that an empty database is provisioned
          # automatically, so assert the collections and indexes really exist.
          docker compose exec -T mongo mongosh pm_dashboard --quiet \
            --eval 'db.getCollectionNames().sort().forEach(c => print(c))' | tee /tmp/collections
          for c in users teams projects tasks chatchannels chatmessages notifications; do
            grep -qx "$c" /tmp/collections || { echo "missing collection: $c" >&2; exit 1; }
          done
          docker compose exec -T mongo mongosh pm_dashboard --quiet \
            --eval 'db.tasks.getIndexes().forEach(i => print(i.name))' | tee /tmp/task_indexes
          grep -q 'assignees' /tmp/task_indexes || { echo "missing assignees index" >&2; exit 1; }
          grep -q 'parentTask' /tmp/task_indexes || { echo "missing parentTask index" >&2; exit 1; }

      - name: Container logs
        if: failure()
        run: docker compose logs --no-color --tail 200

      - name: Tear down
        if: always()
        run: docker compose down -v
